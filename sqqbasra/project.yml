name: Sqqbasra
options:
  bundleIdPrefix: com.saleh
  deploymentTarget:
    iOS: "14.0"
targets:
  Sqqbasra:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saleh.platformer
        PRODUCT_NAME: Sqqbasra
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: sqqbasra
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
