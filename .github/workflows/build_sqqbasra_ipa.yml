name: Build Sqqbasra IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "sqqbasra/**"
      - ".github/workflows/build_sqqbasra_ipa.yml"
  pull_request:
    paths:
      - "sqqbasra/**"
      - ".github/workflows/build_sqqbasra_ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sqqbasra
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Sqqbasra.xcodeproj \
            -scheme Sqqbasra \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sqqbasra.app Payload/
          zip -qry sqqbasra.ipa Payload
          ls -lh sqqbasra.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sqqbasra-ipa
          path: sqqbasra/sqqbasra.ipa
