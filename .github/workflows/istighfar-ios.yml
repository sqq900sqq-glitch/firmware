name: Istighfar iOS IPA
on:
  push:
    branches: [ "claude/gracious-faraday-2hjq3e" ]
    paths: [ "istighfar-ios/App/**", "istighfar-ios/build-ipa.sh", ".github/workflows/istighfar-ios.yml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # macOS arm64 runners are capacity-constrained; try several runner types, first one to finish wins.
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-13, macos-14, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: istighfar-ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Istighfar-ipa-${{ matrix.os }}
          path: istighfar-ios/dist/Istighfar.ipa
      - name: Commit IPA back to branch (first finisher only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git cat-file -e "origin/${GITHUB_REF_NAME}:istighfar-ios/dist/Istighfar.ipa" 2>/dev/null; then echo "IPA already pushed"; exit 0; fi
            git reset --soft "origin/${GITHUB_REF_NAME}" 2>/dev/null || true
            git add -f istighfar-ios/dist/Istighfar.ipa
            git commit -m "Build Istighfar.ipa (${{ matrix.os }}) [skip ci]" || exit 0
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep 5
          done
